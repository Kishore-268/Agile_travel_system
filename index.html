<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agile Travel System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
<h1>✈️ Agile Travel System</h1>
<p>Simple and fast travel booking</p>
</header>
<main>
<section class="card">
<h2>Available Travel Routes</h2>
<div class="routes">
{% for route in routes %}
<div class="route">
<h3>{{ route["from"] }} → {{ route["to"] }}</h3>
<p>Ticket Price: ₹{{ route["price"] }}</p>
<button onclick="selectRoute({{ route['id'] }})">Select</button>
</div>
{% endfor %}
</div>
</section>
<section class="card">
<h2>Book Your Trip</h2>
<form id="bookingForm">
<label for="name">Passenger Name</label>
<input type="text" id="name" placeholder="Enter your name" required>
<label for="route">Select Route</label>
<select id="route" required>
<option value="">-- Select a route --</option>
{% for route in routes %}
<option value="{{ route['id'] }}">{{ route["from"] }} → {{ route["to"] }} - ₹{{ route["price"] }}</option>
{% endfor %}
</select>
<button type="submit" class="book-btn">Book Now</button>
</form>
<p id="message"></p>
</section>
</main>
<footer><p>Agile Travel System | Jenkins + Docker Project</p></footer>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
